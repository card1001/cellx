name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which parts changed. On main (push) and manual runs everything runs, so the
  # packaged build always has every check behind it.
  changes:
    name: 변경 범위
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust || 'true' }}
      frontend: ${{ steps.filter.outputs.frontend || 'true' }}
    steps:
      - uses: actions/checkout@v7
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            rust:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/**'
              - 'vendor/**'
              - 'apps/desktop/src-tauri/**'
              - '.github/workflows/**'
            frontend:
              - 'apps/desktop/**'
              - '!apps/desktop/src-tauri/**'
              - '.github/workflows/**'

  core:
    name: 엔진 테스트
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 엔진 단위 테스트
        run: cargo test -p cellx-core -p cellx-cli

  vendored:
    name: IronCalc(내장 사본) 테스트
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: IronCalc(내장 사본) 단위 테스트
        # The copy is built outside the workspace; its target dir sits under
        # ./target so rust-cache keeps it between runs.
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/vendored
        run: |
          cp -r vendor/ironcalc_base /tmp/ironcalc_base
          printf '\n[workspace]\n' >> /tmp/ironcalc_base/Cargo.toml
          cd /tmp/ironcalc_base && cargo test --release --lib

  compat:
    name: 호환성 측정
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: IronCalc 테스트 파일 받기 (Excel이 만든 xlsx)
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/ironcalc/IronCalc /tmp/ironcalc
          git -C /tmp/ironcalc sparse-checkout set xlsx/tests
      - name: 호환성 측정
        run: cargo run --release -p cellx-cli -- compat /tmp/ironcalc/xlsx/tests --json compat.json
      - uses: actions/upload-artifact@v7
        with:
          name: compat-report
          path: compat.json

  frontend:
    name: 화면 테스트
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build

  desktop-check:
    name: Tauri 명령 크레이트 컴파일 검사
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tauri Linux 시스템 의존성
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file libssl-dev \
            libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev \
            librsvg2-dev
      - name: 데스크톱 명령 크레이트 및 전체 타깃 컴파일
        run: cargo check -p cellx-desktop --all-targets

  desktop:
    name: 데스크톱 패키지 빌드 (${{ matrix.platform }})
    needs: [core, vendored, compat, frontend, desktop-check]
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: 프런트엔드 의존성
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile
      - name: 앱 빌드
        working-directory: apps/desktop
        run: pnpm tauri build ${{ matrix.args }}
      - uses: actions/upload-artifact@v7
        with:
          name: cellx-${{ matrix.platform }}
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: warn

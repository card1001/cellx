name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: 엔진 테스트 + 호환성 측정
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 엔진 단위 테스트
        run: cargo test -p cellx-core -p cellx-cli
      - name: IronCalc(내장 사본) 단위 테스트
        run: |
          cp -r vendor/ironcalc_base /tmp/ironcalc_base
          printf '\n[workspace]\n' >> /tmp/ironcalc_base/Cargo.toml
          cd /tmp/ironcalc_base && cargo test --release --lib
      - name: IronCalc 테스트 파일 받기 (Excel이 만든 xlsx)
        run: git clone --depth 1 https://github.com/ironcalc/IronCalc /tmp/ironcalc
      - name: 호환성 측정
        run: |
          cargo run --release -p cellx-cli -- compat /tmp/ironcalc/xlsx/tests --json compat.json
      - uses: actions/upload-artifact@v7
        with:
          name: compat-report
          path: compat.json

  frontend:
    name: 화면 테스트
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build

  desktop-check:
    name: Tauri 명령 크레이트 컴파일 검사
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tauri Linux 시스템 의존성
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file libssl-dev \
            libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev \
            librsvg2-dev
      - name: 데스크톱 명령 크레이트 및 전체 타깃 컴파일
        run: cargo check -p cellx-desktop --all-targets

  desktop:
    name: 데스크톱 패키지 빌드 (${{ matrix.platform }})
    needs: [core, frontend, desktop-check]
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: 프런트엔드 의존성
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile
      - name: 앱 빌드
        working-directory: apps/desktop
        run: pnpm tauri build ${{ matrix.args }}
      - uses: actions/upload-artifact@v7
        with:
          name: cellx-${{ matrix.platform }}
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: warn

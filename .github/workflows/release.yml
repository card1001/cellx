name: 릴리스

# v로 시작하는 태그를 푸시하면 설치 파일을 빌드해 GitHub Release(초안)에 올립니다.
#   node scripts/bump-version.mjs 0.2.0
#   git commit -am "v0.2.0" && git tag v0.2.0 && git push && git push origin v0.2.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: 버전 확인
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 태그와 앱 버전이 같은지 확인
        run: |
          app="v$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)"
          if [ "$app" != "$GITHUB_REF_NAME" ]; then
            echo "::error::태그 $GITHUB_REF_NAME 와 앱 버전 $app 이 다릅니다. node scripts/bump-version.mjs 로 먼저 맞추세요."
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 엔진 테스트
        run: cargo test --workspace --exclude cellx-desktop

  build:
    name: 설치 파일 (${{ matrix.name }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            platform: windows-latest
            args: ""
          - name: macOS
            platform: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: 프런트엔드 의존성
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      # 코드 서명 (docs/code-signing.md). 비밀값이 없으면 서명하지 않고 빌드합니다.
      - name: 코드 서명 준비 (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          AZURE_KEY_VAULT_CERT_URL: ${{ secrets.AZURE_KEY_VAULT_CERT_URL }}
        run: |
          $conf = "$PWD/apps/desktop/src-tauri/signing.json"
          $windows = $null
          if ($env:WINDOWS_CERTIFICATE) {
            $pfx = "$env:RUNNER_TEMP/cellx.pfx"
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
            $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
            $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
            Remove-Item $pfx
            $windows = @{ certificateThumbprint = $cert.Thumbprint; digestAlgorithm = "sha256"; timestampUrl = "http://timestamp.digicert.com" }
            Write-Host "PFX 인증서로 서명합니다: $($cert.Subject)"
          } elseif ($env:AZURE_KEY_VAULT_CERT_URL) {
            go install github.com/sassoftware/relic/v8@latest
            "$(go env GOPATH)\bin" >> $env:GITHUB_PATH
            $relic = "$env:RUNNER_TEMP/relic.conf"
            $lines = @('tokens:', '  azure:', '    type: azure', 'keys:', '  azure:', '    token: azure', "    id: $env:AZURE_KEY_VAULT_CERT_URL")
            Set-Content -Path $relic -Value $lines
            $windows = @{ signCommand = "relic sign --file %1 --key azure --config $($relic -replace '\\','/')" }
            Write-Host "Azure Key Vault 인증서로 서명합니다"
          } else {
            Write-Host "::warning::서명 비밀값이 없어 서명하지 않은 설치 파일을 만듭니다"
          }
          if ($windows) {
            @{ bundle = @{ windows = $windows } } | ConvertTo-Json -Depth 5 | Set-Content -Path $conf
            "SIGN_ARGS=--config $($conf -replace '\\','/')" >> $env:GITHUB_ENV
          }
      - name: 코드 서명·공증 준비 (macOS)
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Tauri는 이 변수들이 있으면(빈 값이라도) 서명을 시도하므로, 값이 있을 때만 넘깁니다.
          if [ -n "$APPLE_CERTIFICATE" ]; then
            for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              if [ -n "$(printenv "$v")" ]; then
                { echo "$v<<__CELLX__"; printenv "$v"; echo "__CELLX__"; } >> "$GITHUB_ENV"
              fi
            done
            echo "Developer ID 인증서로 서명합니다${APPLE_ID:+ (공증 포함)}"
          else
            echo "::warning::Apple 서명 비밀값이 없어 서명하지 않은 dmg를 만듭니다"
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Azure Key Vault 서명(relic)에 필요한 서비스 주체. 쓰지 않으면 비어 있어도 됩니다.
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: CellX ${{ github.ref_name }}
          releaseBody: |
            ## 설치
            - **Windows**: `CellX_*_x64-setup.exe`(권장, 관리자 권한 없이 사용자 계정에 설치) 또는 `CellX_*_x64_ko-KR.msi`(관리자 배포용)
            - **macOS**: `CellX_*_universal.dmg` (Apple Silicon·Intel 공용)

            Windows에서 「Windows의 PC 보호」 창이 뜨면 **추가 정보 → 실행**을 누르세요. 서명된 설치 파일도 다운로드가 쌓여 평판이 생길 때까지는 이 창이 뜰 수 있습니다.
            서명되지 않은 macOS 앱은 처음 한 번 Control-클릭 → **열기**로 실행하세요.
            파일이 손상되지 않았는지는 `SHA256SUMS.txt`로 확인할 수 있습니다.
          releaseDraft: true
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
          includeUpdaterJson: false
          args: ${{ matrix.args }} ${{ env.SIGN_ARGS }}

  checksums:
    name: 체크섬
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 설치 파일 SHA-256 올리기
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir dist && cd dist
          gh release download "$GITHUB_REF_NAME" --pattern '*.exe' --pattern '*.msi' --pattern '*.dmg'
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS.txt --clobber

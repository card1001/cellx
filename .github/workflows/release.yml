name: 릴리스

# v로 시작하는 태그를 푸시하면 설치 파일을 빌드해 GitHub Release(초안)에 올립니다.
#   node scripts/bump-version.mjs 0.2.0
#   git commit -am "v0.2.0" && git tag v0.2.0 && git push && git push origin v0.2.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: 버전 확인
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 태그와 앱 버전이 같은지 확인
        run: |
          app="v$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)"
          if [ "$app" != "$GITHUB_REF_NAME" ]; then
            echo "::error::태그 $GITHUB_REF_NAME 와 앱 버전 $app 이 다릅니다. node scripts/bump-version.mjs 로 먼저 맞추세요."
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 엔진 테스트
        run: cargo test --workspace --exclude cellx-desktop

  build:
    name: 설치 파일 (${{ matrix.name }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            platform: windows-latest
            args: ""
          - name: macOS
            platform: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: 프런트엔드 의존성
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: CellX ${{ github.ref_name }}
          releaseBody: |
            ## 설치
            - **Windows**: `CellX_*_x64-setup.exe`(권장, 관리자 권한 없이 사용자 계정에 설치) 또는 `CellX_*_x64_ko-KR.msi`(관리자 배포용)
            - **macOS**: `CellX_*_universal.dmg` (Apple Silicon·Intel 공용)

            설치 파일은 아직 코드 서명이 되어 있지 않습니다. Windows에서 「Windows의 PC 보호」 창이 뜨면 **추가 정보 → 실행**을 누르세요.
            macOS에서는 처음 한 번 앱을 Control-클릭 → **열기**로 실행하세요.
            파일이 손상되지 않았는지는 `SHA256SUMS.txt`로 확인할 수 있습니다.
          releaseDraft: true
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
          includeUpdaterJson: false
          args: ${{ matrix.args }}

  checksums:
    name: 체크섬
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 설치 파일 SHA-256 올리기
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir dist && cd dist
          gh release download "$GITHUB_REF_NAME" --pattern '*.exe' --pattern '*.msi' --pattern '*.dmg'
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS.txt --clobber
